name: verify

on:
  push:
    branches: [main]
  pull_request:

# CI runs exactly what you run locally. If those two lists ever drift, CI stops
# being trusted — and a check nobody trusts is a check nobody fixes.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify
