name: verify

on:
  push:
    branches: [main]
  pull_request:

# CI runs exactly what you run locally. If those two lists ever drift, CI stops
# being trusted — and a check nobody trusts is a check nobody fixes.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # BACKEND.md §8 calls the RLS suite the highest-value test in the product,
      # and it has never run here: `lib/db/access-control.test.ts` skips itself
      # unless all three secrets are present, so CI has been reporting green on
      # 5 tests it never executed. Passing them through costs nothing while they
      # are unset — the suite skips exactly as it does today — and the access
      # control test starts running on every PR the moment they are added in
      # Settings → Secrets. Without this, adding the secrets would do nothing.
      - run: npm run verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
